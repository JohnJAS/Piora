<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piora Task Monitor</title>
<style>
  :root { color-scheme: light dark; font: 15px/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText; }
  body { max-width: 34rem; padding: 24px; margin: auto; }
  h1 { font-size: 23px; letter-spacing: -.025em; margin: 0 0 20px; }
  dl { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  dl div { padding: 12px 16px; border: 1px solid color-mix(in srgb, CanvasText 18%, Canvas); border-radius: 10px; }
  dt, #version, #status { color: color-mix(in srgb, CanvasText 75%, Canvas); font-size: 13px; }
  dd { margin: 4px 0 0; font-size: 24px; font-weight: 650; }
  button { font: inherit; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
  footer { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  body.compact dl div { padding: 6px 10px; }
</style>
<main>
  <h1 id="heading">Piora Task Monitor</h1>
  <dl><div><dt id="running-label">Running tasks</dt><dd id="running">–</dd></div>
    <div><dt id="approval-label">Awaiting approval</dt><dd id="approval">–</dd></div></dl>
  <footer><button id="refresh" type="button">Refresh</button>
    <label><input id="compact" type="checkbox"> <span id="compact-label">Compact view</span></label>
    <span id="version"></span></footer>
  <p id="status" role="status"></p>
</main>
<script>
  const element = id => document.getElementById(id);
  const zh = navigator.language.startsWith("zh");
  if (zh) {
    document.documentElement.lang = "zh-CN";
    for (const [id, label] of Object.entries({
      heading: "Piora 任务观察器", "running-label": "运行中的任务", "approval-label": "等待确认",
      refresh: "刷新", "compact-label": "紧凑视图",
    })) element(id).textContent = label;
  }
  async function refresh(method, input) {
    element("refresh").disabled = element("compact").disabled = true;
    try {
      const state = await window.pioraExtension.invoke(method, input);
      element("running").textContent = state.running;
      element("approval").textContent = state.awaitingApproval;
      element("version").textContent = state.version;
      element("compact").checked = state.compact;
      document.body.classList.toggle("compact", state.compact);
      element("status").textContent = "";
    } catch {
      element("status").textContent = zh ? "无法读取任务状态，请重试。" : "Unable to read task status. Try again.";
    } finally {
      element("refresh").disabled = element("compact").disabled = false;
    }
  }
  element("refresh").onclick = () => refresh("monitor.snapshot");
  element("compact").onchange = () => refresh("monitor.set-compact", element("compact").checked);
  void refresh("monitor.snapshot");
</script>
</html>
