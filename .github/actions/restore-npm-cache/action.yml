name: Restore compatible npm download cache
description: Reuse cached npm tarballs from earlier lockfiles; npm ci still verifies lockfile integrity.
runs:
  using: composite
  steps:
    - name: Locate npm download cache
      id: location
      shell: pwsh
      run: |
        $cachePath = npm config get cache
        if ($LASTEXITCODE -ne 0 -or -not $cachePath) { throw 'Unable to locate the npm download cache' }
        "path=$cachePath" >> $env:GITHUB_OUTPUT
    - name: Restore the latest compatible npm download cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.location.outputs.path }}
        key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          node-cache-${{ runner.os }}-${{ runner.arch }}-npm-
