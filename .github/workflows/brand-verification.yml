name: Brand packages and installation upgrade (no release)

on:
  workflow_dispatch:
  push:
    branches: [codex/issue-105-brand-updates]
  pull_request:
    paths:
      - 'branding/**'
      - 'scripts/*brand*'
      - 'desktop/src/*brand*'
      - '.github/workflows/brand-verification.yml'

permissions:
  contents: read

concurrency:
  group: brand-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-packages:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - brand: piora
            prefix: Piora
            sequence: '1'
          - brand: xiaoyi-harness
            prefix: XiaoYiHarness
            sequence: '1'
          - brand: xiaoyi-harness
            prefix: XiaoYiHarness
            sequence: '2'
    env:
      PIORA_BRAND: ${{ matrix.brand }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Set isolated non-release fixture version
        run: node scripts/prepare-brand-ci-version.mjs ${{ matrix.sequence }}
      - name: Verify fixture package and lockfile versions
        run: node scripts/verify-release-metadata.mjs v0.0.0-beta.${{ matrix.sequence }} --prerelease
      - run: npm run dist:win:preview
      - name: Verify installer metadata and packaged identity
        run: node scripts/verify-windows-update-artifacts.mjs desktop/release v0.0.0-beta.${{ matrix.sequence }}
      - run: npm run verify:package
      - name: Check real packaged runtime identity
        run: node scripts/smoke-test-portable.mjs desktop/release/win-unpacked/Piora.exe --expected-version v0.0.0-beta.${{ matrix.sequence }} --packaged-runtime --expected-brand ${{ matrix.brand }}
      - name: Verify portable wrapper
        run: node scripts/verify-portable-artifact.mjs --expected-version v0.0.0-beta.${{ matrix.sequence }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brand-test-${{ matrix.brand }}-${{ matrix.sequence }}
          path: desktop/release/${{ matrix.prefix }}-0.0.0-beta.${{ matrix.sequence }}-win-x64-setup.exe
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  install-upgrade:
    needs: windows-packages
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: brand-test-xiaoyi-harness-*
          path: installers
          merge-multiple: true
      - name: Install consecutive versions and verify preserved data
        shell: pwsh
        run: |
          node scripts/verify-brand-install-upgrade.mjs installers/XiaoYiHarness-0.0.0-beta.1-win-x64-setup.exe installers/XiaoYiHarness-0.0.0-beta.2-win-x64-setup.exe > brand-upgrade-evidence.json
          if ($LASTEXITCODE -ne 0) { throw 'Actual installation upgrade failed' }
      - name: Save successful upgrade evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brand-upgrade-evidence
          path: brand-upgrade-evidence.json
          if-no-files-found: error
          retention-days: 14
