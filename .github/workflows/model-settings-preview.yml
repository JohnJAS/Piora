name: Model settings screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
      - uses: ./.github/actions/restore-npm-cache
      - uses: ./.github/actions/setup-linux-native-image-tools
      - run: npm ci
      - run: npx --no-install playwright-core install --with-deps chromium
      - name: Exercise and capture actual model settings components
        run: node --test lib/models-experience-browser.test.mjs
        env:
          PIORA_EXPERIENCE_SCREENSHOTS: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: model-settings-screenshots
          path: .verification/model-experience-*.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
