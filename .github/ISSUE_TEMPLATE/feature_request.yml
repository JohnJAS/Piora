name: Feature request
description: Propose a focused improvement to Piora
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem before prescribing an implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or limitation should be addressed?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable behavior and what success looks like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: How do you solve this today, and what tradeoffs did you consider?
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Agent and sessions
        - Desktop shell and Windows integration
        - Themes and visual design
        - Models and authentication
        - Files, Git, and worktrees
        - Plugins and skills
        - Packaging and updates
        - Documentation and contributor experience
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, references, or constraints. Do not include secrets or private data.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and pull requests for similar requests.
          required: true
        - label: I have described the user problem and not only a preferred implementation.
          required: true
